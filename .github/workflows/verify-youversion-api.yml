name: Verify YouVersion API

on:
  push:
    branches:
      - fix/youversion-api-20260813
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify App Key is available
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: |
          if [ -z "$YOUVERSION_APP_KEY" ]; then
            echo "YOUVERSION_APP_KEY is missing or empty"
            exit 1
          fi
          echo "YOUVERSION_APP_KEY is present (length=${#YOUVERSION_APP_KEY})"

  votd-reference:
    runs-on: ubuntu-latest
    needs: secret-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Verify today's VOTD reference
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          import requests

          now = datetime.now(ZoneInfo('Asia/Taipei'))
          day = now.timetuple().tm_yday
          url = f"https://api.youversion.com/v1/verse_of_the_days/{day}"
          response = requests.get(url, headers={"X-YVP-App-Key": os.environ["YOUVERSION_APP_KEY"]}, timeout=20)
          print(f"VOTD_HTTP_STATUS={response.status_code}")
          response.raise_for_status()
          data = response.json()
          print(f"VOTD_DAY={data.get('day')}")
          print(f"VOTD_PASSAGE={data.get('passage_id')}")
          assert data.get('day') == day
          assert data.get('passage_id')
          print('VOTD_API_LIVE_PROOF=true')
          PY

  cunp-passage:
    runs-on: ubuntu-latest
    needs: votd-reference
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Discover CUNP version and verify passage access
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          import requests

          headers = {"X-YVP-App-Key": os.environ["YOUVERSION_APP_KEY"], "Accept": "application/json"}
          versions_response = requests.get(
              "https://api.youversion.com/v1/bibles?language_ranges=zh-TW&page_size=100",
              headers=headers,
              timeout=20,
          )
          print(f"BIBLES_HTTP_STATUS={versions_response.status_code}")
          versions_response.raise_for_status()
          versions = versions_response.json().get("data", [])
          candidates = []
          for version in versions:
              haystack = " ".join(str(version.get(key, "")) for key in ("abbreviation", "localized_abbreviation", "title", "localized_title"))
              if "CUNP" in haystack.upper() or "新標點和合本" in haystack or "和合本" in haystack:
                  candidates.append(version)

          print("CUNP_CANDIDATES=" + "; ".join(
              f"{v.get('id')}:{v.get('abbreviation')}:{v.get('title')}" for v in candidates
          ))
          assert candidates, "Could not find a CUNP/和合本 Bible version in YouVersion API"

          version = next(
              (v for v in candidates if "CUNP" in str(v.get("abbreviation", "")).upper()),
              candidates[0],
          )
          version_id = version["id"]
          print(f"CUNP_VERSION_ID={version_id}")

          now = datetime.now(ZoneInfo('Asia/Taipei'))
          day = now.timetuple().tm_yday
          votd = requests.get(
              f"https://api.youversion.com/v1/verse_of_the_days/{day}",
              headers=headers,
              timeout=20,
          )
          votd.raise_for_status()
          passage_id = votd.json()["passage_id"]

          passage_url = f"https://api.youversion.com/v1/bibles/{version_id}/passages/{passage_id}"
          response = requests.get(passage_url, headers=headers, timeout=20)
          print(f"CUNP_HTTP_STATUS={response.status_code}")
          response.raise_for_status()
          data = response.json()
          print(f"CUNP_PASSAGE={passage_id}")
          print(f"CUNP_REFERENCE={data.get('reference')}")
          print(f"CUNP_TEXT_LENGTH={len(data.get('content', ''))}")
          print(f"CUNP_TEXT_PREVIEW={data.get('content', '')[:80]}")
          assert data.get('reference')
          assert data.get('content')
          print('CUNP_API_LIVE_PROOF=true')
          PY
