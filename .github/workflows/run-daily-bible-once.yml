name: Run Daily Bible Bot Once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
    paths:
      - .github/workflows/run-daily-bible-once.yml

permissions:
  contents: read

jobs:
  run-bot:
    if: github.head_ref == 'run/daily-bible-after-scraper-fix-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout merged code plus one-time workflow
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Bot on fixed scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          AUDIO_UPLOAD_URL: ${{ secrets.AUDIO_UPLOAD_URL }}
          AUDIO_UPLOAD_SECRET: ${{ secrets.AUDIO_UPLOAD_SECRET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RUN_MODE: production
          DRY_RUN: 'false'
        run: python bot.py
